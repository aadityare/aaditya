<!DOCTYPE html>
<html>
<head>
  <title>solitude os</title>
  <style>
    body { background:#000; margin:0; }
    iframe { border:0; width:100%; height:100vh; display:block; }
  </style>
</head>
<body>
  <iframe id="sol" src="https://www.aadi.zip/~fun/solitude-os.html"></iframe>
  <script>
    window.addEventListener('message', function(e) {
      if (!e.data || e.data.type !== 'SOL_GET_TASKSTRIPS') return;
      chrome.storage.local.get('taskStrips', function(result) {
        document.getElementById('sol').contentWindow.postMessage({
          type: 'SOL_TASKSTRIPS_DATA',
          data: JSON.stringify(result.taskStrips || [])
        }, '*');
      });
    });
  </script>
</body>
</html>
